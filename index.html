<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de TI - CEMM 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --azul-ucm: #1d5288;
            --azul-claro: #eef4f9;
            --exito: #10b981;
            --error: #ef4444;
            --gris-deco: #94a3b8;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; height: 100vh; background: #f1f5f9; overflow: hidden; }

        .sidebar { width: 38%; background: white; padding: 20px; overflow-y: auto; box-shadow: 4px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .sidebar h2 { color: var(--azul-ucm); font-size: 1.1rem; border-bottom: 3px solid var(--azul-ucm); padding-bottom: 5px; margin: 0; text-transform: uppercase; }

        .field { display: flex; flex-direction: column; gap: 3px; }
        label { font-weight: bold; font-size: 0.65rem; color: #64748b; text-transform: uppercase; }
        input, textarea { padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.8rem; outline: none; transition: border 0.3s; }
        
        /* Alerta título rojo */
        .input-error { border: 2px solid var(--error) !important; background-color: #fff1f1; }

        .section-counter { font-size: 0.6rem; text-align: right; font-weight: bold; color: var(--gris-deco); }

        /* Validador MeSH Estético */
        .mesh-assistant { background: var(--azul-claro); border: 1px dashed var(--azul-ucm); padding: 12px; border-radius: 10px; margin-top: 5px; }
        .mesh-assistant h3 { font-size: 0.75rem; margin: 0 0 8px 0; color: var(--azul-ucm); }
        .mesh-row { display: flex; gap: 5px; }
        .mesh-row input { flex: 1; font-size: 0.8rem; padding: 6px; border: 1px solid #fff; border-radius: 4px; }
        .btn-mesh { background: var(--azul-ucm); color: white; border: none; border-radius: 4px; cursor: pointer; padding: 0 10px; font-size: 0.75rem; font-weight: bold; }
        
        #mesh-status { font-size: 0.75rem; margin-top: 8px; line-height: 1.3; }
        .mesh-valid { color: var(--exito); font-weight: bold; }
        .mesh-invalid { color: var(--error); font-weight: bold; }
        .mesh-tip { display: block; font-size: 0.65rem; color: #475569; font-style: italic; margin-top: 3px; }

        .control-panel { background: var(--azul-ucm); color: white; padding: 12px; border-radius: 10px; text-align: center; margin-top: auto; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn-action { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 0.75rem; }
        .btn-pdf { background: var(--exito); }
        .btn-docx { background: #2563eb; }
        .btn-action:disabled { background: #94a3b8; cursor: not-allowed; opacity: 0.6; }

        .preview-area { flex: 1; padding: 15px; display: flex; justify-content: center; overflow-y: auto; background: #cbd5e0; }
        #document-canvas { 
            width: 210mm; height: 297mm; background: white; padding: 15mm 22mm 30mm 22mm; 
            position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
        }

        #watermark-img {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85mm; height: auto; opacity: 0.06; pointer-events: none; z-index: 1; display: none;
        }

        .deco-triangle-svg { position: absolute; top: 0; right: 0; width: 22mm; height: 22mm; z-index: 5; }
        .deco-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 10mm; background: var(--azul-ucm) !important; z-index: 10; }
        .deco-line { position: absolute; bottom: 10mm; left: 0; width: 100%; height: 1.5mm; background: var(--gris-deco) !important; opacity: 0.2; z-index: 10; }
        .deco-circle { position: absolute; top: -8mm; left: -8mm; width: 35mm; height: 35mm; background: rgba(29, 82, 136, 0.04) !important; border-radius: 50%; z-index: 0; }

        .doc-title { font-size: 14.5pt; font-weight: bold; color: var(--azul-ucm); text-transform: uppercase; margin-top: 8mm; line-height: 1.1; z-index: 20; position: relative; }
        .doc-authors { font-size: 8.2pt; text-align: right; margin-top: 5mm; color: #444; z-index: 20; position: relative; }
        .doc-corr { font-size: 7.5pt; text-align: right; font-style: italic; border-bottom: 0.5pt solid #eee; padding-bottom: 1.5mm; margin-bottom: 3mm; z-index: 20; position: relative; }
        .doc-sec { font-size: 10pt; font-weight: bold; color: var(--azul-ucm); margin-top: 2.5mm; margin-bottom: 1mm; z-index: 20; position: relative; }
        .doc-body { font-size: 9.2pt; line-height: 1.35; text-align: justify; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; color: #000; z-index: 20; position: relative; }
        .doc-k { font-size: 9.2pt; font-weight: bold; margin-top: 4mm; border-top: 0.5pt dashed #ddd; padding-top: 2mm; z-index: 20; position: relative; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>GENERADOR DE TI - CEMM 2026</h2>
    
    <div class="field">
        <label>Título (Máximo 20 palabras)</label>
        <textarea id="in-t" placeholder="Ej: IMPACTO DE LA CIRUGÍA..." oninput="sync()"></textarea>
        <div id="cnt-t" class="section-counter">0 / 20</div>
    </div>
    
    <div class="field">
        <label>Autores y Afiliaciones</label>
        <textarea id="in-a" placeholder="Ej: Juan Pérez (1), Dra. Jara (2). (1) Facultad de Medicina UCM..." oninput="sync()"></textarea>
    </div>
    
    <div class="field"><label>Correspondencia</label><input type="text" id="in-cr" placeholder="Ej: nombre@ejemplo.cl" oninput="sync()"></div>

    <div class="field"><label>Introducción</label><textarea id="in-i" oninput="sync()"></textarea><div id="cnt-i" class="section-counter">0 pal.</div></div>
    <div class="field"><label>Presentación del Caso</label><textarea id="in-p" oninput="sync()"></textarea><div id="cnt-p" class="section-counter">0 pal.</div></div>
    <div class="field"><label>Discusión</label><textarea id="in-d" oninput="sync()"></textarea><div id="cnt-d" class="section-counter">0 pal.</div></div>
    <div class="field"><label>Conclusión</label><textarea id="in-c" oninput="sync()"></textarea><div id="cnt-c" class="section-counter">0 pal.</div></div>
    
    <div class="field"><label>Palabras Clave (MeSH)</label><input type="text" id="in-k" placeholder="Ej: Obesity, Gastroplasty" oninput="sync()"></div>

    <div class="mesh-assistant">
        <h3>🔍 Validador MeSH Académico</h3>
        <div class="mesh-row">
            <input type="text" id="m-search" placeholder="Término en inglés...">
            <button class="btn-mesh" onclick="searchMesh()">Validar</button>
        </div>
        <div id="mesh-status">Escribe un término para validar contra PubMed.</div>
    </div>

    <div class="control-panel">
        <div id="w-total" style="font-weight: bold; font-size: 1rem;">Cuerpo: 0 / 500</div>
        <div class="btn-group">
            <button class="btn-action btn-pdf" id="b-pdf" disabled onclick="exportPDF()">DESCARGAR PDF</button>
            <button class="btn-action btn-docx" id="b-docx" disabled onclick="exportDOCX()">DESCARGAR WORD</button>
        </div>
    </div>
</div>

<div class="preview-area">
    <div id="document-canvas">
        <img id="watermark-img" src="">
        <div class="deco-circle"></div>
        <svg class="deco-triangle-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polygon points="100,0 0,0 100,100" fill="#1d5288"/>
        </svg>
        <div class="deco-bar"></div><div class="deco-line"></div>
        
        <div class="doc-title" id="out-t">TÍTULO DEL TRABAJO</div>
        <div class="doc-authors" id="out-a">Autores y Afiliaciones</div>
        <div class="doc-corr" id="out-cr">Correspondencia: ...</div>
        
        <div class="doc-sec">Introducción</div><div class="doc-body" id="out-i"></div>
        <div class="doc-sec">Presentación del Caso</div><div class="doc-body" id="out-p"></div>
        <div class="doc-sec">Discusión</div><div class="doc-body" id="out-d"></div>
        <div class="doc-sec">Conclusión</div><div class="doc-body" id="out-c"></div>
        
        <div class="doc-k" id="out-k">Palabras clave: ...</div>
    </div>
</div>

    // =====================================================

    if(MARCA_AGUA_DATA) {
        const img = document.getElementById('watermark-img');
        img.src = MARCA_AGUA_DATA;
        img.style.display = 'block';
    }

    const getCount = (s) => s.trim().split(/\s+/).filter(x => x.length > 0).length;

    function sync() {
        const v = (id) => document.getElementById(id).value;
        const setTxt = (id, val) => document.getElementById(id).innerText = val;

        // Lógica de Título: Bloqueo y Alerta Roja
        let titleInput = document.getElementById('in-t');
        let wordsT = titleInput.value.trim().split(/\s+/).filter(x => x.length > 0);
        
        if(wordsT.length > 20) {
            titleInput.value = wordsT.slice(0, 20).join(" ");
            wordsT = wordsT.slice(0, 20);
        }

        document.getElementById('cnt-t').innerText = wordsT.length + " / 20";
        titleInput.classList.toggle('input-error', wordsT.length >= 20);

        // Contadores cuerpo
        const ci = getCount(v('in-i')), cp = getCount(v('in-p')), cd = getCount(v('in-d')), cc = getCount(v('in-c'));
        document.getElementById('cnt-i').innerText = ci + " pal.";
        document.getElementById('cnt-p').innerText = cp + " pal.";
        document.getElementById('cnt-d').innerText = cd + " pal.";
        document.getElementById('cnt-c').innerText = cc + " pal.";

        const total = ci + cp + cd + cc;
        document.getElementById('w-total').innerText = "Cuerpo: " + total + " / 500";
        document.getElementById('b-pdf').disabled = document.getElementById('b-docx').disabled = (total === 0 || total > 500);

        setTxt('out-t', titleInput.value.toUpperCase() || "TÍTULO DEL TRABAJO");
        setTxt('out-a', v('in-a') || "Autores y Afiliaciones");
        setTxt('out-cr', "Correspondencia: " + (v('in-cr') || "..."));
        setTxt('out-i', v('in-i')); setTxt('out-p', v('in-p'));
        setTxt('out-d', v('in-d')); setTxt('out-c', v('in-c'));
        setTxt('out-k', "Palabras clave: " + (v('in-k') || "..."));

        fitPage();
    }

    // Reduce progresivamente el cuerpo de texto para que, con hasta 500 palabras,
    // el contenido siga cabiendo dentro de la única página A4 sin desbordarse ni cortarse.
    const BASE_BODY_PT = 9.2, MIN_BODY_PT = 6.8;
    const BASE_LH = 1.35, MIN_LH = 1.15;
    const BASE_SEC_MT = 2.5, MIN_SEC_MT = 1.2;
    const BASE_TITLE_MT = 8, MIN_TITLE_MT = 3;
    const BASE_AUTH_MT = 5, MIN_AUTH_MT = 2;
    const BASE_K_MT = 4, MIN_K_MT = 1.5;

    function fitPage() {
        const canvas = document.getElementById('document-canvas');
        const bodies = document.querySelectorAll('.doc-body');
        const secs = document.querySelectorAll('.doc-sec');
        const title = document.querySelector('.doc-title');
        const authors = document.querySelector('.doc-authors');
        const keywords = document.querySelector('.doc-k');

        let pt = BASE_BODY_PT;
        bodies.forEach(b => { b.style.fontSize = pt + 'pt'; b.style.lineHeight = BASE_LH; });
        secs.forEach(s => { s.style.marginTop = BASE_SEC_MT + 'mm'; });
        title.style.marginTop = BASE_TITLE_MT + 'mm';
        authors.style.marginTop = BASE_AUTH_MT + 'mm';
        keywords.style.marginTop = BASE_K_MT + 'mm';

        // Fase 1: reducir tamaño y espaciado del cuerpo de texto
        while (canvas.scrollHeight > canvas.clientHeight && pt > MIN_BODY_PT) {
            pt = Math.max(MIN_BODY_PT, pt - 0.1);
            const lh = Math.max(MIN_LH, BASE_LH - (BASE_BODY_PT - pt) * 0.02);
            const mt = Math.max(MIN_SEC_MT, BASE_SEC_MT - (BASE_BODY_PT - pt) * 0.15);
            bodies.forEach(b => { b.style.fontSize = pt.toFixed(2) + 'pt'; b.style.lineHeight = lh; });
            secs.forEach(s => { s.style.marginTop = mt.toFixed(2) + 'mm'; });
        }

        // Fase 2: si aún desborda en el tamaño mínimo, comprimir márgenes del encabezado
        let step = 0;
        while (canvas.scrollHeight > canvas.clientHeight && step < 20) {
            step++;
            const f = step / 20;
            title.style.marginTop = (BASE_TITLE_MT - (BASE_TITLE_MT - MIN_TITLE_MT) * f).toFixed(2) + 'mm';
            authors.style.marginTop = (BASE_AUTH_MT - (BASE_AUTH_MT - MIN_AUTH_MT) * f).toFixed(2) + 'mm';
            keywords.style.marginTop = (BASE_K_MT - (BASE_K_MT - MIN_K_MT) * f).toFixed(2) + 'mm';
        }
    }

    async function searchMesh() {
        const t = document.getElementById('m-search').value.trim();
        const s = document.getElementById('mesh-status');
        if(!t) return;
        s.innerHTML = "⏳ Consultando PubMed...";
        try {
            const r = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=mesh&term=${t}&retmode=json`);
            const j = await r.json();
            if(j.esearchresult.count > 0) {
                s.innerHTML = `<span class="mesh-valid">✅ "${t}" es un término MeSH válido.</span>`;
            } else {
                s.innerHTML = `<span class="mesh-invalid">❌ No encontrado en MeSH.</span><br><span class="mesh-tip">Sugerencia: Usa Inglés (ej: Obesity) o sinónimos generales.</span>`;
            }
        } catch(e) { s.innerText = "Error de red."; }
    }

    async function exportPDF() {
        const btn = document.getElementById('b-pdf');
        btn.innerText = "⏳ GENERANDO...";
        const canvas = await html2canvas(document.getElementById('document-canvas'), { scale: 2, useCORS: true });
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
        pdf.save("Trabajo_TI_CEMM2026.pdf");
        btn.innerText = "DESCARGAR PDF";
    }

    function exportDOCX() {
        const { Document, Packer, Paragraph, TextRun, AlignmentType } = window.docx;
        const v = (id) => document.getElementById(id).value;
        const doc = new Document({
            sections: [{
                children: [
                    new Paragraph({ children: [new TextRun({ text: v('in-t').toUpperCase(), bold: true, size: 28, color: "1d5288" })] }),
                    new Paragraph({ children: [new TextRun({ text: v('in-a'), size: 17 })], alignment: AlignmentType.RIGHT }),
                    ...["Introducción", "Presentación del Caso", "Discusión", "Conclusión"].flatMap(sec => {
                        const m = {"Introducción":'in-i', "Presentación del Caso":'in-p', "Discusión":'in-d', "Conclusión":'in-c'};
                        return [
                            new Paragraph({ children: [new TextRun({ text: sec, bold: true, size: 20, color: "1d5288" })], spacing: { before: 150 } }),
                            new Paragraph({ children: [new TextRun({ text: v(m[sec]), size: 18 })], alignment: AlignmentType.JUSTIFIED })
                        ];
                    })
                ]
            }]
        });
        Packer.toBlob(doc).then(blob => saveAs(blob, "Trabajo_TI.docx"));
    }
